name: Deploy Supabase Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "supabase/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.vitest.json"
      - ".github/workflows/supabase-deploy.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.vitest.json"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('supabase-test-{0}', github.ref) || format('supabase-deploy-{0}', github.ref == 'refs/heads/main' && 'production' || 'dev') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: Type-check Edge Functions with Deno
        run: |
          deno check --no-config --no-lock supabase/functions/auth-token/index.ts
          deno check --config supabase/functions/ai-coach/deno.json --no-lock supabase/functions/ai-coach/index.ts
          deno check --no-config --no-lock supabase/functions/delete-account/index.ts
          deno check --no-config --no-lock supabase/functions/billing/index.ts
          deno check --no-config --no-lock supabase/functions/billing-webhook/index.ts

      - name: Run Edge security tests with Deno
        run: deno test --no-config --no-lock --allow-env supabase/functions/*/*.deno.test.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Edge formatting and lint rules
        run: pnpm exec biome check supabase/

      - name: Run Vitest Edge Function and architecture tests
        run: pnpm vitest run supabase/functions/ src/modules/architecture.boundaries.test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start local Supabase database
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run database pgTAP tests
        run: supabase test db

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      ABUSE_PREVENTION_PEPPER: ${{ secrets.ABUSE_PREVENTION_PEPPER }}
      ABUSE_PREVENTION_PEPPER_PREVIOUS: ${{ secrets.ABUSE_PREVENTION_PEPPER_PREVIOUS }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_MONTHLY_PRICE_ID || secrets.STRIPE_MONTHLY_PRICE_ID }}
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL || secrets.APP_PUBLIC_URL }}
      AI_DAILY_COST_CAP_USD: ${{ vars.AI_DAILY_COST_CAP_USD || secrets.AI_DAILY_COST_CAP_USD }}
    steps:
      - name: Validate environment configuration
        run: |
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_PROJECT_ID, SUPABASE_ACCESS_TOKEN, or SUPABASE_DB_PASSWORD for this environment." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Missing GEMINI_API_KEY or GOOGLE_CLIENT_SECRET for Edge Function secrets." >&2
            exit 1
          fi
          PEPPER_TRIMMED="$(trim "$ABUSE_PREVENTION_PEPPER")"
          if [ -z "$PEPPER_TRIMMED" ] || [ "${#PEPPER_TRIMMED}" -lt 32 ]; then
            echo "Missing or too short ABUSE_PREVENTION_PEPPER (minimum 32 characters)." >&2
            exit 1
          fi
          PREV_PEPPER_TRIMMED="$(trim "$ABUSE_PREVENTION_PEPPER_PREVIOUS")"
          if [ -n "$PREV_PEPPER_TRIMMED" ] && [ "${#PREV_PEPPER_TRIMMED}" -lt 32 ]; then
            echo "ABUSE_PREVENTION_PEPPER_PREVIOUS must be at least 32 characters when set." >&2
            exit 1
          fi
          STRIPE_KEY_TRIMMED="$(trim "$STRIPE_SECRET_KEY")"
          if [ -n "$STRIPE_KEY_TRIMMED" ]; then
            if [ "$DEPLOY_ENV" = "dev" ] && ! printf '%s' "$STRIPE_KEY_TRIMMED" | grep -qE '^(sk|rk)_test_'; then
              echo "Refusing to deploy non-test Stripe key to dev (expected sk_test_* or rk_test_*)." >&2
              exit 1
            fi
            if [ "$DEPLOY_ENV" = "production" ] && ! printf '%s' "$STRIPE_KEY_TRIMMED" | grep -qE '^(sk|rk)_live_'; then
              echo "Refusing to deploy non-live Stripe key to production (expected sk_live_* or rk_live_*)." >&2
              exit 1
            fi
          else
            echo "::notice::STRIPE_SECRET_KEY is not set for $DEPLOY_ENV; checkout, customer portal, and webhook sync remain inactive while FreeAllowance and InviteGrants are active."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link Supabase Project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Sync Edge Function Secrets
        run: |
          # Note: `supabase secrets set` is additive; remove obsolete secrets (e.g. ABUSE_PREVENTION_PEPPER_PREVIOUS after rotation) manually with `supabase secrets unset`.
          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          PEPPER_TRIMMED="$(trim "$ABUSE_PREVENTION_PEPPER")"
          PREV_PEPPER_TRIMMED="$(trim "$ABUSE_PREVENTION_PEPPER_PREVIOUS")"
          STRIPE_KEY_TRIMMED="$(trim "$STRIPE_SECRET_KEY")"
          WEBHOOK_SECRET_TRIMMED="$(trim "$STRIPE_WEBHOOK_SECRET")"
          PRICE_ID_TRIMMED="$(trim "$STRIPE_MONTHLY_PRICE_ID")"
          APP_URL_TRIMMED="$(trim "$APP_PUBLIC_URL")"
          COST_CAP_TRIMMED="$(trim "$AI_DAILY_COST_CAP_USD")"
          CLIENT_ID_TRIMMED="$(trim "$GOOGLE_CLIENT_ID")"
          SECRET_ARGS=(
            "GEMINI_API_KEY=$GEMINI_API_KEY"
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            "ABUSE_PREVENTION_PEPPER=$PEPPER_TRIMMED"
          )
          if [ -n "$CLIENT_ID_TRIMMED" ]; then
            SECRET_ARGS+=("GOOGLE_CLIENT_ID=$CLIENT_ID_TRIMMED")
          fi
          if [ -n "$PREV_PEPPER_TRIMMED" ]; then
            SECRET_ARGS+=("ABUSE_PREVENTION_PEPPER_PREVIOUS=$PREV_PEPPER_TRIMMED")
          fi
          if [ -n "$STRIPE_KEY_TRIMMED" ]; then
            SECRET_ARGS+=("STRIPE_SECRET_KEY=$STRIPE_KEY_TRIMMED")
          fi
          if [ -n "$WEBHOOK_SECRET_TRIMMED" ]; then
            SECRET_ARGS+=("STRIPE_WEBHOOK_SECRET=$WEBHOOK_SECRET_TRIMMED")
          fi
          if [ -n "$PRICE_ID_TRIMMED" ]; then
            SECRET_ARGS+=("STRIPE_MONTHLY_PRICE_ID=$PRICE_ID_TRIMMED")
          fi
          if [ -n "$APP_URL_TRIMMED" ]; then
            SECRET_ARGS+=("APP_PUBLIC_URL=$APP_URL_TRIMMED")
          fi
          if [ -n "$COST_CAP_TRIMMED" ]; then
            SECRET_ARGS+=("AI_DAILY_COST_CAP_USD=$COST_CAP_TRIMMED")
          fi
          supabase secrets set "${SECRET_ARGS[@]}" --yes

      - name: Push Database Migrations
        run: supabase db push --remote --yes

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy auth-token --no-verify-jwt --yes
          supabase functions deploy ai-coach --no-verify-jwt --yes
          supabase functions deploy delete-account --no-verify-jwt --yes
          supabase functions deploy billing --no-verify-jwt --yes
          supabase functions deploy billing-webhook --no-verify-jwt --yes
