name: Deploy Supabase Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
    steps:
      - name: Validate environment configuration
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_PROJECT_ID, SUPABASE_ACCESS_TOKEN, or SUPABASE_DB_PASSWORD for this environment." >&2
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "Missing GEMINI_API_KEY or GOOGLE_CLIENT_SECRET for Edge Function secrets." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link Supabase Project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Sync Edge Function Secrets
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            supabase secrets set \
              GEMINI_API_KEY="$GEMINI_API_KEY" \
              GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              --yes
          else
            supabase secrets set \
              GEMINI_API_KEY="$GEMINI_API_KEY" \
              GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              --yes
          fi

      - name: Push Database Migrations
        run: supabase db push --remote --yes

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy auth-token --no-verify-jwt --yes
          supabase functions deploy ai-coach --no-verify-jwt --yes
